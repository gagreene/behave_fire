name: Live C++ validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  live:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, compiler: GNU}
          - {os: windows-2025, compiler: MSVC}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --no-install-project --extra test
      - name: Run live C++ inventory and golden tests
        env:
          BEHAVE_CPP_LIVE: '1'
          BEHAVE_CPP_LIVE_COMPILER: ${{ matrix.compiler }}
          BEHAVE_CPP_LIVE_OUT: ${{ runner.temp }}/cpp-${{ matrix.compiler }}
        run: uv run --no-sync python -m pytest tests/cpp_live -m cpp_live
      - name: Preserve numerical calibration only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpp-calibration-${{ matrix.compiler }}
          path: ${{ runner.temp }}/cpp-${{ matrix.compiler }}/*-calibration.json
          if-no-files-found: error
