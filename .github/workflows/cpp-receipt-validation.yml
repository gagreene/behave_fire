name: Validate approved C++ receipts

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --no-install-project --extra test
      - name: Verify approved C++ evidence for this revision
        run: uv run --no-sync python tools/cpp_receipt.py --check-release-claims
