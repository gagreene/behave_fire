name: CI

on:
  pull_request:
  push:
    branches: [pre_release, master]
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml -p behave-fire --locked --no-fail-fast
      - run: cargo doc --manifest-path rust/Cargo.toml --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Read workspace MSRV
        id: msrv
        run: python -c 'import os,tomllib; open(os.environ["GITHUB_OUTPUT"],"a").write("version="+tomllib.load(open("rust/Cargo.toml","rb"))["workspace"]["package"]["rust-version"]+"\n")'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - run: cargo check --manifest-path rust/Cargo.toml --workspace --all-targets --locked
      - run: cargo test --manifest-path rust/Cargo.toml -p behave-fire --locked --no-fail-fast

  python-only:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --no-install-project --extra test --extra dev
      - name: Prove source tests have no native extension and required extras exist
        run: |
          uv run --no-sync python -c 'import importlib.util,sys; import pytest,build,twine; sys.path.insert(0,"src"); assert importlib.util.find_spec("behave_fire._rust") is None'
      - run: uv run --no-sync python tools/check_rust_tables.py --check
      - run: uv run --no-sync python -m pytest

  native-pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra test --extra dev
      - run: uv run --no-sync python -m pytest --require-rust
      - name: Record scalar alias compatibility evidence
        if: always()
        run: uv run --no-sync python tools/probe_numpy_aliases.py
      - name: Record platform-dependent integer casts
        if: always()
        run: uv run --no-sync python tools/probe_platform_oracle.py --native > numpy-platform-oracle.json
      - name: Record float32 direction oracle evidence
        if: always()
        run: uv run --no-sync python tools/probe_direction_oracle.py > numpy-direction-oracle.json
      - name: Record every independent direction fixture outcome
        if: always()
        run: uv run --no-sync python tools/probe_direction_fixtures.py > numpy-direction-fixtures.json
      - name: Record direction layout and all core direction oracles
        if: always()
        run: uv run --no-sync python tools/probe_direction_layout.py > numpy-direction-layout.json
      - name: Record independent direction fixtures without AVX512 dispatch
        if: always()
        shell: bash
        run: |
          uv run --no-sync python - <<'PY'
          import os
          import subprocess
          import sys
          from numpy._core import _multiarray_umath
          features = _multiarray_umath.__cpu_features__
          disabled = sorted(name for name in features if name.startswith("AVX512") or name == "X86_V4")
          environment = dict(os.environ, NPY_DISABLE_CPU_FEATURES=",".join(disabled))
          with open("numpy-direction-fixtures-baseline.json", "w") as output:
              subprocess.run([sys.executable, "tools/probe_direction_fixtures.py"], env=environment, stdout=output, check=True)
          with open("numpy-direction-layout-baseline.json", "w") as output:
              subprocess.run([sys.executable, "tools/probe_direction_layout.py"], env=environment, stdout=output, check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numpy-platform-oracle-${{ matrix.os }}
          path: numpy-platform-oracle.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numpy-direction-oracle-${{ matrix.os }}
          path: |
            numpy-direction-oracle.json
            numpy-direction-fixtures.json
            numpy-direction-fixtures-baseline.json
            numpy-direction-layout.json
            numpy-direction-layout-baseline.json
          if-no-files-found: warn

  wheel-validation:
    uses: ./.github/workflows/wheel-validation.yml

  crate-validation:
    uses: ./.github/workflows/crate-validation.yml
