name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [pre_release, master]
  workflow_call:
    inputs:
      cpp_live:
        type: boolean
        default: false
      tier:
        # Present only for release.yml calls, which always run the full tier.
        type: string
        default: full
  workflow_dispatch:
    inputs:
      scope:
        description: "full: complete platform and packaging checks. Targeted scopes build and test only the named artifacts."
        type: choice
        options: [full, musl, sdist, musl-and-sdist]
        default: full
      cpp_qualification:
        description: "Collect the nine C++ calibration reports (full scope only); approval remains a separate decision."
        type: boolean
        default: false

permissions:
  contents: read

# A newer run for the same pull request, or for pre_release, cancels the older one. Every other run
# (master, tags, workflow_dispatch, and a pull request edit that does not change the base branch) gets
# a unique group, so it is never cancelled and never replaces a queued run. GitHub keeps only one
# pending run per group, so a shared group would drop queued master runs even without cancellation.
concurrency:
  group: ci-${{ (github.event.action == 'edited' && !github.event.changes.base) && github.run_id || github.event.pull_request.number || (github.ref == 'refs/heads/pre_release' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/pre_release' }}

# Tiers, decided once by the plan job:
# - quick: pull requests into any branch except master, and pushes to pre_release (Python style/order, fmt,
#   Clippy, Rust core tests, the table check, and one Python and one native job). Merging into pre_release
#   never starts the full wheel matrix.
# - full: pull requests into master (promotion and hotfix), release.yml through workflow_call, a manual
#   dispatch with scope full, and a master push whose landed tree has no successful full result.
# - reused: a master push whose Git tree equals the merge tree that a successful full pull request run tested.
#   The plan job records that run and every other job is skipped.
# - targeted: a manual dispatch with scope musl, sdist, or musl-and-sdist builds and tests only those artifacts.
# - none: a pull request edit that does not change the base branch (title or description).
# Comparisons against pinned C++ outputs are not part of these tiers; they run in the full local check
# before every merge (docs/CONTRIBUTION_PROCEDURES.md), and C++ qualification is a separate manual input.
jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      scope: ${{ steps.plan.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
      - name: Choose the tier and reuse a matching full result on master
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BASE_CHANGED: ${{ github.event.changes.base != null }}
          BASE_REF: ${{ github.base_ref }}
          CALLED_TIER: ${{ inputs.tier }}
          SCOPE: ${{ inputs.scope }}
        run: python tools/ci_plan.py >> "$GITHUB_OUTPUT"

  style:
    needs: plan
    if: ${{ contains(fromJSON('["quick","full"]'), needs.plan.outputs.tier) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --no-install-project --extra test --extra dev
      - run: uv run --no-sync python -m ruff check src tests tools
      - run: uv run --no-sync python tools/check_function_order.py --require-labels
      - run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --locked -- -D warnings

  rust:
    needs: plan
    if: ${{ contains(fromJSON('["quick","full"]'), needs.plan.outputs.tier) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.tier == 'full' && '["ubuntu-24.04","macos-15","windows-2025"]' || '["ubuntu-24.04"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: Test binding field and raster parity contracts
        run: cargo test --manifest-path tools/binding_field_tests/Cargo.toml --locked -- --test-threads=1
      - run: cargo test --manifest-path rust/Cargo.toml -p behave-fire --locked --no-fail-fast
      - run: cargo doc --manifest-path rust/Cargo.toml --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    needs: plan
    if: ${{ needs.plan.outputs.tier == 'full' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Read workspace MSRV
        id: msrv
        run: python -c 'import os,tomllib; open(os.environ["GITHUB_OUTPUT"],"a").write("version="+tomllib.load(open("rust/Cargo.toml","rb"))["workspace"]["package"]["rust-version"]+"\n")'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - run: cargo check --manifest-path rust/Cargo.toml --workspace --all-targets --locked
      - name: Test binding field and raster parity contracts
        run: cargo test --manifest-path tools/binding_field_tests/Cargo.toml --locked -- --test-threads=1
      - run: cargo test --manifest-path rust/Cargo.toml -p behave-fire --locked --no-fail-fast

  python-only:
    needs: plan
    if: ${{ contains(fromJSON('["quick","full"]'), needs.plan.outputs.tier) }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.plan.outputs.tier == 'full' && '["3.11","3.12","3.13","3.14"]' || '["3.12"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --no-install-project --extra test --extra dev
      - name: Prove source tests have no native extension and required extras exist
        run: |
          uv run --no-sync python -c 'import importlib.util,sys; import pytest,build,twine; sys.path.insert(0,"src"); assert importlib.util.find_spec("behave_fire._rust") is None'
      - run: uv run --no-sync python tools/check_rust_tables.py --check
      - run: uv run --no-sync python -m pytest -m "not cpp_comparison"

  native-pytest:
    needs: plan
    if: ${{ contains(fromJSON('["quick","full"]'), needs.plan.outputs.tier) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.tier == 'full' && '["ubuntu-24.04","macos-15","windows-2025"]' || '["ubuntu-24.04"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra test --extra dev
      - run: uv run --no-sync python -m pytest --require-rust -m "not cpp_comparison"
      - name: Record scalar alias compatibility evidence
        if: always()
        run: uv run --no-sync python tools/probe_numpy_aliases.py
      - name: Record platform-dependent integer casts
        if: always()
        run: uv run --no-sync python tools/probe_platform_oracle.py --native > numpy-platform-oracle.json
      - name: Record float32 direction oracle evidence
        if: always()
        run: uv run --no-sync python tools/probe_direction_oracle.py > numpy-direction-oracle.json
      - name: Record every independent direction fixture outcome
        if: always()
        run: uv run --no-sync python tools/probe_direction_fixtures.py > numpy-direction-fixtures.json
      - name: Record direction layout and all core direction oracles
        if: always()
        run: uv run --no-sync python tools/probe_direction_layout.py > numpy-direction-layout.json
      - name: Record independent direction fixtures without AVX512 dispatch
        if: always()
        shell: bash
        run: |
          uv run --no-sync python - <<'PY'
          import os
          import subprocess
          import sys
          from numpy._core import _multiarray_umath
          features = _multiarray_umath.__cpu_features__
          disabled = sorted(name for name in features if name.startswith("AVX512") or name == "X86_V4")
          environment = dict(os.environ, NPY_DISABLE_CPU_FEATURES=",".join(disabled))
          with open("numpy-direction-fixtures-baseline.json", "w") as output:
              subprocess.run([sys.executable, "tools/probe_direction_fixtures.py"], env=environment, stdout=output, check=True)
          with open("numpy-direction-layout-baseline.json", "w") as output:
              subprocess.run([sys.executable, "tools/probe_direction_layout.py"], env=environment, stdout=output, check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numpy-platform-oracle-${{ matrix.os }}
          path: numpy-platform-oracle.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numpy-direction-oracle-${{ matrix.os }}
          path: |
            numpy-direction-oracle.json
            numpy-direction-fixtures.json
            numpy-direction-fixtures-baseline.json
            numpy-direction-layout.json
            numpy-direction-layout-baseline.json
          if-no-files-found: warn

  wheel-validation:
    needs: [plan, style, rust, msrv, python-only, native-pytest, crate-validation]
    uses: ./.github/workflows/wheel-validation.yml
    # Targeted dispatches skip the quick jobs; any failed prerequisite still stops the wheels.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && contains(fromJSON('["full","targeted"]'), needs.plan.outputs.tier) }}
    with:
      scope: ${{ needs.plan.outputs.scope }}
      # Calibration reports are collected for a manual qualification request and for release.yml manual runs.
      cpp_calibration: ${{ github.event_name == 'workflow_dispatch' && needs.plan.outputs.tier == 'full' && (inputs.cpp_qualification == true || inputs.tier == 'full') }}

  crate-validation:
    needs: plan
    uses: ./.github/workflows/crate-validation.yml
    if: ${{ needs.plan.outputs.tier == 'full' }}

  cpp-calibration:
    needs: plan
    if: ${{ (github.event_name == 'workflow_dispatch' && needs.plan.outputs.tier == 'full' && (inputs.cpp_qualification == true || inputs.tier == 'full')) || inputs.cpp_live }}
    uses: ./.github/workflows/cpp-live-validation.yml

  full-result:
    # Proof for the master push: written only after every full-tier job of a pull request into master passed.
    needs: [plan, style, rust, msrv, python-only, native-pytest, crate-validation, wheel-validation]
    if: ${{ success() && github.event_name == 'pull_request' && needs.plan.outputs.tier == 'full' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Record the tested merge tree
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir result
          python - <<'PY'
          import json, os, subprocess
          tree = subprocess.run(["git", "rev-parse", "HEAD^{tree}"], check=True, capture_output=True, text=True)
          record = {"tier": "full", "tree": tree.stdout.strip(), "merge_sha": os.environ["GITHUB_SHA"],
                    "head_sha": os.environ["HEAD_SHA"], "base_sha": os.environ["BASE_SHA"],
                    "pull_request": int(os.environ["NUMBER"]), "run_id": int(os.environ["GITHUB_RUN_ID"])}
          with open("result/result.json", "w", encoding="utf-8") as handle:
              json.dump(record, handle, indent=2)
          print(json.dumps(record))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ci-full-result
          path: result/result.json
          if-no-files-found: error
