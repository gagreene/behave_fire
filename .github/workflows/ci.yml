name: CI

on:
  pull_request:
  push:
    branches:
      - pre_release
      - master

permissions:
  contents: read

jobs:
  native-python:
    name: Native Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Create an isolated native test environment
        shell: bash
        run: |
          python -m venv .venv-native
          if [ "$RUNNER_OS" = Windows ]; then
            native_python=.venv-native/Scripts/python.exe
          else
            native_python=.venv-native/bin/python
          fi
          "$native_python" -m pip install --only-binary=:all: numpy==2.1.3 'pytest>=9.0.2' maturin==1.10.0
          echo "NATIVE_PYTHON=$native_python" >> "$GITHUB_ENV"
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv-native" >> "$GITHUB_ENV"
      - name: Build the explicit development backend
        shell: bash
        env:
          MATURIN_NO_INSTALL_RUST: "1"
        run: '"$NATIVE_PYTHON" -m maturin develop --release --manifest-path rust/crates/behave-py/Cargo.toml'
      - name: Require native execution in the full suite
        shell: bash
        run: '"$NATIVE_PYTHON" -m pytest --require-rust'
      - name: Record scalar alias compatibility evidence
        if: always() && env.NATIVE_PYTHON != ''
        shell: bash
        run: '"$NATIVE_PYTHON" tools/probe_numpy_aliases.py'
      - name: Record platform-dependent integer casts
        if: always() && env.NATIVE_PYTHON != ''
        shell: bash
        run: '"$NATIVE_PYTHON" tools/probe_platform_oracle.py --native > numpy-platform-oracle.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numpy-platform-oracle-${{ matrix.os }}
          path: numpy-platform-oracle.json
          if-no-files-found: warn

  rust-core:
    name: Rust core (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, msrv]
    steps:
      - uses: actions/checkout@v4
      - name: Select toolchain from workspace metadata
        id: toolchain
        shell: bash
        run: |
          if [ '${{ matrix.toolchain }}' = msrv ]; then
            version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' rust/Cargo.toml)
          else
            version=stable
          fi
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
          components: rustfmt
      - name: Check Rust formatting
        if: matrix.toolchain == 'stable'
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - name: Test standalone core without Python discovery
        env:
          PYO3_PYTHON: missing-python-for-core-check
        run: cargo test --manifest-path rust/Cargo.toml -p behave-fire --locked
      - name: Inspect core runtime dependencies
        run: cargo tree --manifest-path rust/Cargo.toml -p behave-fire --edges normal --locked

  python-only:
    name: Python only (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies without building the project
        run: >-
          python -m pip install --only-binary=:all:
          "numpy==2.1.3; python_version < '3.14'"
          "numpy==2.3.3; python_version >= '3.14'"
          "pytest>=9.0.2"
      - name: Verify native extension is absent
        run: |
          python - <<'PY'
          import importlib.util
          import sys
          sys.path.insert(0, "src")
          assert importlib.util.find_spec("behave_fire._rust") is None
          PY
      - name: Verify embedded Rust tables against the Python reference
        run: python tools/check_rust_tables.py --check
      - name: Run full Python-only suite
        run: python -m pytest
