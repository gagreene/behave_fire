name: Release standalone crate

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish an approved behave-fire-vX.Y.Z tag (default: checks only)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/crate-validation.yml

  publish-crate:
    if: inputs.publish
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/behave-fire
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require the independent version tag on released history
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/crates/behave-fire/Cargo.toml)
          test "$GITHUB_REF" = "refs/tags/behave-fire-v${version}"
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' rust/Cargo.toml)
          test -n "$msrv"
          echo "msrv=$msrv" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.release.outputs.msrv }}
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish the already verified core
        run: cargo publish --manifest-path rust/Cargo.toml -p behave-fire --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
