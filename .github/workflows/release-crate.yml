name: Release standalone crate

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish an approved behave-fire-vX.Y.Z tag (default: checks only)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/crate-validation.yml

  cpp-live:
    uses: ./.github/workflows/cpp-live-validation.yml

  qualification-gate:
    # Only an actual crates.io upload needs an active C++ qualification for this source;
    # check-only runs skip this job, so they stay available while qualification is withdrawn.
    if: inputs.publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --no-install-project --extra test
      - name: Require an active C++ qualification that matches these sources
        run: uv run --no-sync python tools/cpp_inventory.py --check --require-ready

  publish-crate:
    if: inputs.publish
    needs: [verify, cpp-live, qualification-gate]
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/behave-fire
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require the independent version tag on released history
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/crates/behave-fire/Cargo.toml)
          test "$GITHUB_REF" = "refs/tags/behave-fire-v${version}"
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' rust/Cargo.toml)
          test -n "$msrv"
          echo "msrv=$msrv" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.release.outputs.msrv }}
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish the already verified core
        run: cargo publish --manifest-path rust/Cargo.toml -p behave-fire --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
