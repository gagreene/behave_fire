[pytest]
# ---------------------------------------------------------------------------
# behave_fire — pytest configuration
# ---------------------------------------------------------------------------

# Resolve the source package, test packages, and flat shared test helpers.
pythonpath = src . tests

testpaths =
    tests/unit
    tests/integration
    tests/regression
    tests/cpp_live

addopts = --import-mode=prepend --no-header -q

markers =
    cpp_reference: offline pinned C++ observations; numerical approval is a separate gate
    cpp_live: explicitly selected live pinned C++ qualification
    cpp_comparison: compares Python or Rust outputs with pinned C++ outputs; CI deselects it, the full local check runs it
    integration: tests combining components, backends, tools, or distributions
    regression: tests preserving fixes for confirmed defects
    rust: requires the compatible native extension; --require-rust makes absence an error
    slow: tests with substantial run time
