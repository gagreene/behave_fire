[pytest]
# ---------------------------------------------------------------------------
# behave_fire — pytest configuration
# ---------------------------------------------------------------------------

# Import the package only through behave_fire, avoiding duplicate components modules.
pythonpath = src

# Where pytest looks for tests
testpaths = tests

# Keep collected regression-test output concise.
addopts = --no-header -q

markers =
    rust: requires the compatible native extension; --require-rust makes absence an error

# Collect test_upstream_*_array.py and other array regression tests.
# test_behave.py uses a separate custom harness, not pytest fixtures.
# See README.md for its standalone invocation.
python_files = test_*_array.py
