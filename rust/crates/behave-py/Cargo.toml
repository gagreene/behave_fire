[package]
name = "behave-py"
version = "1.0.0-beta.2"
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
repository.workspace = true
description = "Python bindings for the standalone behave-fire core"

[lib]
name = "_rust"
crate-type = ["cdylib"]

[dependencies]
behave-fire = { path = "../behave-fire", version = "0.1.0" }
numpy = "=0.27.0"
pyo3 = { version = "=0.27.0", features = ["extension-module", "abi3-py311"] }
